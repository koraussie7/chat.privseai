# Docker Compose for PrivseAI Inference Servers
# Run: docker-compose -f docker-compose.inference.yml up -d

version: "3.8"

services:
  # ============================================
  # Colibri WASM / Fellowship Node (Tier 2)
  # Port: 3001
  # ============================================
  fellowship:
    image: muhanai/fellowship:latest
    container_name: privseai-fellowship
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - LOG_LEVEL=info
      - ENABLE_WASM=true
      - MAX_CONCURRENT=10
      - MODEL_CACHE_DIR=/data/models
      - PRUNE_INTERVAL=3600
    volumes:
      - fellowship-models:/data/models
      - fellowship-logs:/var/log/fellowship
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G

  # ============================================
  # Girlfriend.ai Server (Tier 3)
  # Port: 3002
  # ============================================
  girlfriend-ai:
    image: giovancarl444/girlfriend-ai:latest
    container_name: privseai-girlfriend-ai
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - LOG_LEVEL=info
      - DB_PATH=/data/gf.db
      - ENABLE_NSFW=true
      - MAX_HISTORY=50
    volumes:
      - girlfriend-ai-data:/data
      - girlfriend-ai-logs:/var/log/girlfriend-ai
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G

  # ============================================
  # MuhanAI OmniRoute Proxy (Optional - if self-hosted)
  # Port: 4000
  # ============================================
  omniroute:
    image: muhanai/omniroute:latest
    container_name: privseai-omniroute
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - ROUTER_MODE=smart
      - DEFAULT_MODEL=omni
      - FALLBACK_MODELS=qwen3-0.6b,qwen2.5-7b,llama3.2-3b
      - TIMEOUT_MS=20000
      - RATE_LIMIT=100
    volumes:
      - omniroute-cache:/cache
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # ============================================
  # freellmpool — pooled free LLM gateway (MIT)
  # OpenAI-compatible proxy over 20+ free providers w/ failover
  # Port: 8080 (localhost only — quota-gateway is the public face)
  # ============================================
  freellmpool:
    image: ghcr.io/0xzr/freellmpool:latest
    container_name: privseai-freellmpool
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Shared token the quota-gateway uses to reach this proxy.
      - FREELLMPOOL_PROXY_KEY=${FREELLMPOOL_PROXY_KEY:-}
      # Optional provider keys — keyless routes (Pollinations/OVHcloud/Kilo)
      # answer without any, add these for more capacity:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - LLM7_API_KEY=${LLM7_API_KEY:-}
    volumes:
      - freellmpool-data:/home/freellmpool/.config/freellmpool
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ============================================
  # quota-gateway — per-user daily quotas in front of freellmpool
  # (server/quota-gateway.py, stdlib-only Python)
  # Port: 4005 (Caddy routes /freellm/* here)
  # ============================================
  quota-gateway:
    image: python:3.12-alpine
    container_name: privseai-quota-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:4005:4005"
    environment:
      - LISTEN_HOST=0.0.0.0
      - LISTEN_PORT=4005
      - FREELLMPOOL_URL=http://freellmpool:8080
      - FREELLMPOOL_KEY=${FREELLMPOOL_PROXY_KEY:-}
      - QUOTA_USERS_FILE=/data/users.json
      - QUOTA_STATE_FILE=/data/quota.json
      - QUOTA_DEFAULT_REQUESTS=${QUOTA_DEFAULT_REQUESTS:-100}
      - QUOTA_DEFAULT_TOKENS=${QUOTA_DEFAULT_TOKENS:-200000}
      - ADMIN_TOKEN=${QUOTA_ADMIN_TOKEN:-}
      - ALLOWED_ORIGINS=https://privseai.com
    volumes:
      - ./server/quota-gateway.py:/app/quota-gateway.py:ro
      - quota-gateway-data:/data
    command: ["python", "/app/quota-gateway.py"]
    depends_on:
      freellmpool:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  fellowship-models:
  fellowship-logs:
  girlfriend-ai-data:
  girlfriend-ai-logs:
  omniroute-cache:
  freellmpool-data:
  quota-gateway-data:

networks:
  default:
    name: privseai-inference